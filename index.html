<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Player 2.0</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ФОНОВЫЕ СЛОИ -->
    <div id="bg-layer"></div>
    <div id="particles"></div>

    <!-- КАРТОЧКА ПЛЕЕРА -->
    <main class="player-card" id="playerCard">
        
        <!-- Секция обложки -->
        <div class="cover-section">
            <div class="album-art" id="albumArt">
                <!-- Неоновые линии по бокам -->
                <div class="neon-glow glow-left" id="neon-glow-left"></div>
                <div class="neon-glow glow-right" id="neon-glow-right"></div>
            </div>
            
            <!-- Кнопка Lite Mode -->
            <button id="btnLiteMode" class="lite-mode-btn" title="Lite Mode (Экономия ресурсов)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                </svg>
            </button>
        </div>

        <!-- Информация о треке и Субтитры -->
        <div class="track-info">
            <h2 id="trackName">Загрузка...</h2>
            <h3 id="trackArtist">...</h3>
            <!-- Контейнер для текста песни -->
            <div id="lyricsContainer" class="lyrics-box"></div>
        </div>

        <!-- Визуалайзер (полоски) -->
        <div class="visualizer-box" id="visualizerBox">
            <!-- Полоски генерируются через JS -->
        </div>

        <!-- Прогресс бар -->
        <div class="progress-section">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-labels">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn-control" id="btnPrev">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                </svg>
            </button>
            
            <button class="btn-control btn-play" id="btnPlay">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            
            <button class="btn-control" id="btnNext">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>
            
            <button class="btn-control" id="btnPlaylist" title="Библиотека">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
        </div>

        <!-- Громкость -->
        <div class="volume-section">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="opacity: 0.7;">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
        </div>
    </main>

    <!-- БОКОВАЯ ПАНЕЛЬ (ПЛЕЙЛИСТ) -->
    <aside class="playlist-panel" id="playlistPanel">
        <div class="playlist-header">
            <h3>Библиотека</h3>
            <div class="header-actions">
                <!-- Кнопка загрузки своего файла -->
                <button class="icon-btn" id="btnAddTrack" title="Загрузить трек с устройства">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
                    </svg>
                </button>
                <input type="file" id="fileUpload" accept="audio/*" style="display: none;">
            </div>
        </div>
        
        <!-- Поиск -->
        <input type="text" id="searchParams" placeholder="Поиск по трекам...">
        
        <!-- Список треков -->
        <div class="playlist-items" id="playlistContainer">
            <!-- Треки генерируются через JS -->
        </div>
    </aside>

    <!-- АУДИО ЭЛЕМЕНТ -->
    <audio id="audioEl" crossorigin="anonymous"></audio>

    <!-- СКРИПТЫ -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
